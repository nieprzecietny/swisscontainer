# nginx projektu (dev-services, jako vscode): podgląd statycznego buildu (dist/) jak na produkcji, SPA fallback.
# @…@ podstawia dev-services.
worker_processes 2;
pid @RUN@/nginx.pid;
error_log @RUN@/nginx-error.log warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log @RUN@/nginx-access.log;
    sendfile off;
    client_body_temp_path @RUN@/nginx/client_body;
    proxy_temp_path       @RUN@/nginx/proxy;
    fastcgi_temp_path     @RUN@/nginx/fastcgi;
    uwsgi_temp_path       @RUN@/nginx/uwsgi;
    scgi_temp_path        @RUN@/nginx/scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 127.0.0.1:@PORT@;
        server_name localhost;
        root @DIST@;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
        location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
            try_files $uri =404;
            expires 1h;
        }
    }
}
