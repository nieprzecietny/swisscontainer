[program:phpmyadmin]
; wbudowany serwer PHP (tylko localhost) jako `pma`; 24575 = E_ALL & ~E_DEPRECATED
command=/usr/bin/php8.5 -S 127.0.0.1:8080 -t /usr/share/phpmyadmin -d display_errors=0 -d log_errors=1 -d error_reporting=24575 -d expose_php=0 -d session.save_path=/var/lib/phpmyadmin/sessions -d upload_tmp_dir=/var/lib/phpmyadmin/tmp -d memory_limit=512M -d upload_max_filesize=256M -d post_max_size=256M
user=pma
directory=/usr/share/phpmyadmin
environment=HOME="/var/lib/phpmyadmin",USER="pma",PHP_CLI_SERVER_WORKERS="4"
priority=30
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/devc/phpmyadmin.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
