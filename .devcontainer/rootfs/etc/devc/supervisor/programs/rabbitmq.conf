[program:rabbitmq]
; konfiguracja: /etc/rabbitmq/{rabbitmq.conf,rabbitmq-env.conf,enabled_plugins}; epmd i dystrybucja Erlanga tylko na 127.0.0.1
command=/usr/lib/rabbitmq/bin/rabbitmq-server
user=rabbitmq
directory=/var/lib/rabbitmq
environment=HOME="/var/lib/rabbitmq",USER="rabbitmq",ERL_EPMD_ADDRESS="127.0.0.1"
priority=40
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/devc/rabbitmq.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
