[program:mssql]
command=/opt/mssql/bin/sqlservr
user=mssql
directory=/var/opt/mssql
environment=HOME="/var/opt/mssql",USER="mssql",ACCEPT_EULA="Y",MSSQL_PID="%(ENV_DEVC_MSSQL_PID)s",MSSQL_MEMORY_LIMIT_MB="%(ENV_DEVC_MSSQL_MEMORY_LIMIT_MB)s",MSSQL_IP_ADDRESS="127.0.0.1",MSSQL_TCP_PORT="1433"
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/devc/mssql.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
