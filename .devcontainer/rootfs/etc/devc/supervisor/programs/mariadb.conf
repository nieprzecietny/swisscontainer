[program:mariadb]
; --init-file: stan uprawnień (root tylko przez gniazdo, dev bez uprawnień globalnych) odtwarzany przy każdym starcie
command=/usr/sbin/mariadbd --init-file=/run/devc-mariadb/init.sql
user=mysql
directory=/var/lib/mysql
environment=HOME="/var/lib/mysql",USER="mysql"
priority=20
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/devc/mariadb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
