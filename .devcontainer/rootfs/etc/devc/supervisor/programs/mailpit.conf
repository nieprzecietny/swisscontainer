[program:mailpit]
command=/usr/local/bin/mailpit --database /var/lib/mailpit/mailpit.db --listen 127.0.0.1:8025 --smtp 127.0.0.1:1025 --smtp-auth-accept-any --smtp-auth-allow-insecure --disable-version-check
user=mailpit
directory=/var/lib/mailpit
environment=HOME="/var/lib/mailpit",USER="mailpit"
priority=50
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/var/log/devc/mailpit.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
