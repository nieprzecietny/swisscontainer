; supervisord devcontainera — uruchamiany przez container-init.sh (root). Gniazdo tylko dla roota (D34).
[unix_http_server]
file=/run/devc/supervisor.sock
chmod=0700
chown=root:root

[supervisord]
user=root
logfile=/var/log/devc/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/devc/supervisord.pid
childlogdir=/var/log/devc
nodaemon=false
minfds=65536
strip_ansi=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/devc/supervisor.sock

; programy tylko dla usług z DEV_SERVICES — kopiowane z /etc/devc/supervisor/programs przez container-init.sh
[include]
files=/run/devc/supervisor/conf.d/*.conf
