; PHP-FPM projektu (dev-services, jako vscode); ${DEVC_RUN} ustawia dev-services.
[global]
pid = ${DEVC_RUN}/php-fpm.pid
error_log = ${DEVC_RUN}/php-fpm.log
daemonize = yes

[app]
listen = ${DEVC_RUN}/php-fpm.sock
listen.mode = 0600
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; zmienne środowiska (DATABASE_URL itp.) widoczne w aplikacji
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; hot reload: zmiana pliku PHP widoczna bez restartu
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 0
php_value[display_errors] = On
php_value[error_reporting] = E_ALL
